name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    name: Verify with Java 11
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Test and verify runnable JAR
        run: make check
      - name: Keep runnable JAR for the Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: runnable-jar
          path: dist/einstein-intelligence-test.jar
          if-no-files-found: error

  windows-installer:
    name: Windows installer
    needs: compile
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runnable-jar
          path: input
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Resolve installer version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = "1.0.$env:RUN_NUMBER"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Release tags must use vMAJOR.MINOR.PATCH"
            }
            $version = $Matches[1]
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      # jpackage needs WiX Toolset 3, which windows-latest provides.
      # The fixed upgrade UUID and rising version let a new MSI replace an installed one.
      - name: Build MSI with bundled Java runtime
        shell: pwsh
        run: >
          jpackage --type msi
          --input input
          --main-jar einstein-intelligence-test.jar
          --name "Einstein Intelligence Test"
          --app-version "$env:APP_VERSION"
          --vendor "Zlatan Stajic"
          --description "Einstein's riddle puzzle game"
          --add-modules "java.base,java.desktop,java.sql"
          --win-per-user-install
          --win-menu
          --win-menu-group "Einstein Intelligence Test"
          --win-shortcut
          --win-upgrade-uuid "b1120305-441e-4694-b13d-101c8754377c"
          --dest installer
      # Enable only after the free SignPath Foundation project is approved.
      - name: Upload installer for signing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        id: unsigned-msi
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer
          path: installer/*.msi
          if-no-files-found: error
      - name: Sign Windows installer
        if: steps.unsigned-msi.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1200
          output-artifact-directory: signed-installer
      - name: Verify and use signed installer
        if: steps.unsigned-msi.outcome == 'success'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem signed-installer -Filter *.msi)
          $original = @(Get-ChildItem installer -Filter *.msi)
          if ($signed.Count -ne 1 -or $original.Count -ne 1 -or $signed[0].Name -ne $original[0].Name) {
            throw "Signing must return exactly the requested MSI"
          }
          $signature = Get-AuthenticodeSignature $signed[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "Invalid installer signature: $($signature.Status)"
          }
          Copy-Item $signed[0].FullName $original[0].FullName -Force
      - name: Publish MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: installer/*.msi
          if-no-files-found: error

  release:
    name: Publish tagged downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compile, windows-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: runnable-jar
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: packages
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          # GitHub replaces spaces in release asset names with dots. Normalize first
          # so checksum entries match the files players actually download.
          for package in packages/*.msi; do
            normalized="${package// /.}"
            if [[ "$package" != "$normalized" ]]; then
              mv -- "$package" "$normalized"
            fi
          done
          (cd packages && sha256sum *.jar *.msi > SHA256SUMS.txt)
          gh release upload "$RELEASE_TAG" packages/*.jar packages/*.msi packages/SHA256SUMS.txt --clobber
